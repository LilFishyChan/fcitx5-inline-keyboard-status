[Addon]
Name=Inline Keyboard Status
Comment=Exports fcitx5 input panel state as JSON for the Inline Keyboard touch keyboard
Category=UI
Type=SharedLibrary
# 用户级安装：fcitx5 不搜 ~/.local/lib/fcitx5，必须给绝对路径（不带 .so）
Library=@LIBDIR@/inline-keyboard-status
Version=0.3.1
UIPriority=50
# OnScreenKeyboard：只有键盘打开时才被当成有效 UI，收起后 classicui 接管
UIType=OnScreenKeyboard
OnDemand=True

[Addon/Dependencies]
0=core:5.1.0
